name: study-partner

networks:
  sp-network:
    driver: bridge

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studypartner}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: Asia/Shanghai
    volumes:
      - sp-postgres-data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    networks:
      - sp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-studypartner}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Task Queue
  redis:
    image: redis:7-alpine
    container_name: sp-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      TZ: Asia/Shanghai
    volumes:
      - sp-redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - sp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. MinIO Object Storage
  minio:
    image: quay.io/minio/minio:latest
    container_name: sp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: Asia/Shanghai
    volumes:
      - sp-minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - sp-network

  # 4. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sp-qdrant
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - sp-qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - sp-network

  # 5. Judge Sandbox (go-judge)
  # 编程题在这里编译运行学生代码。go-judge 依赖 Linux 容器嵌套，需要 privileged
  # 与足够的 /dev/shm。Docker Desktop(Windows/WSL2) 下常因 cgroup 限制起不来，
  # 正式部署请用 Linux 宿主机。
  judge:
    build:
      context: ./judge
      dockerfile: Dockerfile
    container_name: sp-judge
    restart: unless-stopped
    privileged: true
    shm_size: 256m
    environment:
      TZ: Asia/Shanghai
    ports:
      - "5050:5050"
    networks:
      - sp-network

  # 6. Backend Server (FastAPI)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sp-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./server:/code
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=AI伴学与智能体协同平台
      - APP_ENV=development
      - APP_DEBUG=true
      - ENABLE_INLINE_SCHEDULER=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-studypartner}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - JUDGE_BASE_URL=${JUDGE_BASE_URL:-http://judge:5050}
      - JUDGE_AUTH_TOKEN=${JUDGE_AUTH_TOKEN:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_me_generate_with_openssl_rand_hex_32}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - SILICONFLOW_BASE_URL=${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      - SILICONFLOW_CHAT_API_KEY=${SILICONFLOW_CHAT_API_KEY:-}
      - SILICONFLOW_CHAT_BASE_URL=${SILICONFLOW_CHAT_BASE_URL:-}
      - SILICONFLOW_CHAT_MODEL=${SILICONFLOW_CHAT_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      - SILICONFLOW_EMBEDDING_API_KEY=${SILICONFLOW_EMBEDDING_API_KEY:-}
      - SILICONFLOW_EMBEDDING_BASE_URL=${SILICONFLOW_EMBEDDING_BASE_URL:-}
      - SILICONFLOW_EMBEDDING_MODEL=${SILICONFLOW_EMBEDDING_MODEL:-BAAI/bge-m3}
      - QUESTION_PARSING_API_KEY=${QUESTION_PARSING_API_KEY:-}
      - QUESTION_PARSING_BASE_URL=${QUESTION_PARSING_BASE_URL:-https://new-api.070210.xyz/v1}
      - QUESTION_PARSING_MODEL=${QUESTION_PARSING_MODEL:-deepseek-v4.1-flash}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      judge:
        condition: service_started
    networks:
      - sp-network

  # 7. Celery Worker
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sp-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info
    volumes:
      - ./server:/code
    environment:
      - APP_NAME=AI伴学与智能体协同平台
      - APP_ENV=development
      - APP_DEBUG=true
      - ENABLE_INLINE_SCHEDULER=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-studypartner}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - JUDGE_BASE_URL=${JUDGE_BASE_URL:-http://judge:5050}
      - JUDGE_AUTH_TOKEN=${JUDGE_AUTH_TOKEN:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_me_generate_with_openssl_rand_hex_32}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - SILICONFLOW_BASE_URL=${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      - SILICONFLOW_CHAT_API_KEY=${SILICONFLOW_CHAT_API_KEY:-}
      - SILICONFLOW_CHAT_BASE_URL=${SILICONFLOW_CHAT_BASE_URL:-}
      - SILICONFLOW_CHAT_MODEL=${SILICONFLOW_CHAT_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      - SILICONFLOW_EMBEDDING_API_KEY=${SILICONFLOW_EMBEDDING_API_KEY:-}
      - SILICONFLOW_EMBEDDING_BASE_URL=${SILICONFLOW_EMBEDDING_BASE_URL:-}
      - SILICONFLOW_EMBEDDING_MODEL=${SILICONFLOW_EMBEDDING_MODEL:-BAAI/bge-m3}
      - QUESTION_PARSING_API_KEY=${QUESTION_PARSING_API_KEY:-}
      - QUESTION_PARSING_BASE_URL=${QUESTION_PARSING_BASE_URL:-https://new-api.070210.xyz/v1}
      - QUESTION_PARSING_MODEL=${QUESTION_PARSING_MODEL:-deepseek-v4.1-flash}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      judge:
        condition: service_started
    networks:
      - sp-network

  # 8. Celery Beat Scheduler
  beat:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sp-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery_app beat --loglevel=info
    volumes:
      - ./server:/code
    environment:
      - APP_NAME=AI伴学与智能体协同平台
      - APP_ENV=development
      - APP_DEBUG=true
      - ENABLE_INLINE_SCHEDULER=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-studypartner}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - JUDGE_BASE_URL=${JUDGE_BASE_URL:-http://judge:5050}
      - JUDGE_AUTH_TOKEN=${JUDGE_AUTH_TOKEN:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_me_generate_with_openssl_rand_hex_32}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - SILICONFLOW_BASE_URL=${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      - SILICONFLOW_CHAT_API_KEY=${SILICONFLOW_CHAT_API_KEY:-}
      - SILICONFLOW_CHAT_BASE_URL=${SILICONFLOW_CHAT_BASE_URL:-}
      - SILICONFLOW_CHAT_MODEL=${SILICONFLOW_CHAT_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      - SILICONFLOW_EMBEDDING_API_KEY=${SILICONFLOW_EMBEDDING_API_KEY:-}
      - SILICONFLOW_EMBEDDING_BASE_URL=${SILICONFLOW_EMBEDDING_BASE_URL:-}
      - SILICONFLOW_EMBEDDING_MODEL=${SILICONFLOW_EMBEDDING_MODEL:-BAAI/bge-m3}
      - QUESTION_PARSING_API_KEY=${QUESTION_PARSING_API_KEY:-}
      - QUESTION_PARSING_BASE_URL=${QUESTION_PARSING_BASE_URL:-https://new-api.070210.xyz/v1}
      - QUESTION_PARSING_MODEL=${QUESTION_PARSING_MODEL:-deepseek-v4.1-flash}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      judge:
        condition: service_started
    networks:
      - sp-network

volumes:
  sp-postgres-data:
  sp-redis-data:
  sp-minio-data:
  sp-qdrant-data:
